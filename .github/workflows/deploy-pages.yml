---
name: Deploy to GitHub Pages

# quoted so YAML 1.1 parsers do not read the key as the boolean `true`
"on":
  push:
    branches: [main]
    # the site is entirely static, so only rebuild when it or its data changes
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  # allows a manual run from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact
permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # no build step: site/ is plain HTML, CSS and JS, uploaded as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
